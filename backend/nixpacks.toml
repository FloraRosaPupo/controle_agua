# Root Directory = backend — só isto entra na imagem.
# providers = ["node"] sozinho não estava aplicando setup no Railway; nixPkgs força o nix-env.
providers = ["node"]

[phases.setup]
# npm vem junto com nodejs no nixpkgs; o atributo "npm" sozinho não existe nesse pin.
nixPkgs = ["nodejs"]

# Railway costuma definir NODE_ENV=production; npm ci aí NÃO instala devDependencies
# (TypeScript some → `tsc` → exit 127).
[phases.install]
dependsOn = ["setup"]
cmds = ["NPM_CONFIG_PRODUCTION=false npm ci"]

# Build da imagem não recebe as env do runtime; Prisma exige DATABASE_URL no schema.
[phases.build]
dependsOn = ["install"]
cmds = [
  "sh -c 'export DATABASE_URL=\"${DATABASE_URL:-postgresql://127.0.0.1:5432/prisma_build?schema=public}\"; npm run build'",
  "npm prune --omit=dev",
]

[start]
cmd = "npm start"
