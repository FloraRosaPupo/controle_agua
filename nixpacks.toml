# Monorepo: Railway sem "Root Directory" = só a raiz entra no contexto do Nixpacks.
# Sem este arquivo na raiz, backend/nixpacks.toml não é lido e o Docker some com nix/npm.
[phases.setup]
nixPkgs = ["nodejs_20", "npm"]

[phases.install]
cmds = ["cd backend && npm ci"]

[phases.build]
cmds = ["cd backend && npm run build"]

[start]
cmd = "cd backend && npm start"
